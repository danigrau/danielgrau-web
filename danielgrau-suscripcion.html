<!doctype html>
<html lang="es">
<head>

  <title>¿Quieres que sigamos en contacto? — Daniel Grau</title>
  <style>
    :root { --paper:#e2d3b8; --ink:#2c2924; --ink-soft:#6d6558; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Georgia, "Times New Roman", serif; color:var(--ink); background:var(--paper); }
    main { max-width:54rem; margin:0 auto; padding:clamp(2rem,6vw,5rem) clamp(1.25rem,4vw,2rem) 5rem; }
    h1 { font-size:clamp(2.4rem,5vw,4.2rem); font-weight:500; margin:0 0 1rem; }
    p { font-size:1.1rem; line-height:1.75; color:var(--ink-soft); max-width:42rem; }

<body>
  <main>
    <a class="back" href="index.html#reflexiones">← Volver a la portada</a>
    <h1>¿Quieres que sigamos en contacto?</h1>
    <p>De vez en cuando comparto reflexiones sobre creatividad, libros, historias y las cosas que me hacen pensar. Si quieres recibir mis próximos textos por correo electrónico, puedes suscribirte gratuitamente a <em>Reflexiones</em>.</p>
    <div class="signup">
      <iframe src="https://danielgrau3333.substack.com/embed" title="Formulario de suscripción gratuita a Reflexiones" loading="lazy" scrolling="no"></iframe>
